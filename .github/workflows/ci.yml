name: Package CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Newton package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Newton package
        uses: actions/checkout@v6
        with:
          path: package

      - name: Check out Blacknode
        uses: actions/checkout@v6
        with:
          repository: temiroff/Blacknode
          path: core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./core
          python -m pip install "newton[importers,sim]>=1.4,<2" "xacro>=2.1,<3" "viser>=1,<2"

      - name: Link package into Blacknode
        run: |
          mkdir -p core/packages
          ln -s "$GITHUB_WORKSPACE/package" core/packages/blacknode-newton

      - name: Run Newton tests
        working-directory: package
        env:
          PYTHONPATH: ../core/python
        run: python -m unittest discover -s tests -v

      - name: Validate package catalog
        working-directory: core
        env:
          PYTHONPATH: python
        run: python -m blacknode.cli packages validate-catalog ../package

      - name: Validate package templates
        working-directory: core
        env:
          PYTHONPATH: python
        run: |
          find ../package/templates -name '*.json' -print0 | while IFS= read -r -d '' template; do
            python -m blacknode.cli validate "$template"
          done
